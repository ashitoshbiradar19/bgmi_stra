<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Soniqs">
  <defs>
    <linearGradient id="plate" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#052430"/>
      <stop offset="100%" stop-color="#05070b"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="plateClip">
      <rect x="6" y="6" width="244" height="244" rx="46"/>
    </clipPath>
  </defs>
  <rect x="6" y="6" width="244" height="244" rx="46" fill="url(#plate)"/>
  <g clip-path="url(#plateClip)">
    <rect x="6" y="6" width="244" height="150" fill="url(#sweep)"/>
    <circle cx="60" cy="204" r="86" fill="#22d3ee" opacity="0.10"/>
  </g>
  <rect x="18" y="18" width="220" height="220" rx="36" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.55"/>
  <circle cx="128" cy="126" r="62" fill="none" stroke="#22d3ee" stroke-width="5" opacity="0.22"/>
  <text x="128" y="158" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700"
        font-size="90" fill="#ffffff">SNQ</text>
  <rect x="98" y="200" width="60" height="6" rx="3" fill="#22d3ee" opacity="0.9"/>
</svg>
